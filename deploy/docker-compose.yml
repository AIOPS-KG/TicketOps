services:
  ticketops:
    image: nginx:alpine
    container_name: ticketops
    restart: unless-stopped
    volumes:
      - /data/server/services/app/ticketops/www:/usr/share/nginx/html:ro
      - /data/server/services/app/ticketops/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - proxy
    depends_on:
      - ticketops-backend

  ticketops-backend:
    image: ticketops-backend:latest
    container_name: ticketops-backend
    restart: unless-stopped
    environment:
      - PORT=5060
      - NODE_ENV=production
      - PGHOST=postgres
      - PGPORT=5432
      - PGUSER=ticketops
      - PGPASSWORD=Ticketops@2024!
      - PGDATABASE=ticketops_app
    networks:
      - proxy

networks:
  proxy:
    external: true
