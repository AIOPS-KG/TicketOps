server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/ {
        proxy_pass http://ticketops-backend:5060/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-TicketOps-User $http_x_ticketops_user;
        proxy_set_header X-TicketOps-Role $http_x_ticketops_role;
        proxy_read_timeout 30s;
    }

    location / { try_files $uri $uri/ /index.html; }
    location /customer { try_files $uri /customer.html; }
    location ~* \.(js|css|png|jpg|svg|ico|woff2?)$ { expires 1y; add_header Cache-Control "public, immutable"; }
}
